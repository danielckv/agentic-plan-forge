max_retries = 3
accept = ["200..=299", "429"]
include_mail = false
# Only links that cannot resolve from CI remain excluded: GitHub pages that
# require a signed-in session.
exclude = [
  '^https://github.com/danielckv/agentic-plan-forge/security/advisories/new$',
  '^https://github.com/danielckv/agentic-plan-forge/issues/new/choose$',
  # OpenAI answers automated requests with 403. The page is correct; a browser
  # loads it. Excluding it keeps the check honest for links that can be checked.
  '^https://platform\.openai\.com/',
]
exclude_path = ['^\.agents/']
