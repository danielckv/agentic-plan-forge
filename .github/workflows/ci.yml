name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub has no native debounce, so this is it: every job waits on a step
  # that sleeps, and `cancel-in-progress` above kills the whole run when the
  # next push arrives. Only the last push of a burst ever reaches the jobs
  # below, so one piece of work costs one CI run instead of one per push.
  #
  # The wait is skipped outside a pull request: a push to main is already the
  # final state of its work, and a dispatch is a deliberate ask.
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Coalesce a burst of pushes
        if: github.event_name == 'pull_request'
        run: sleep 900

  actionlint:
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint
        run: ./actionlint -color

  markdownlint:
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

  editorconfig:
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - name: Run editorconfig-checker
        run: editorconfig-checker

  links:
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --config lychee.toml '**/*.md'
          fail: true

  go-shared:
    needs: debounce
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Test untagged shared packages
        run: go test ./internal/contracts/... ./internal/config/... ./internal/session/... ./internal/collab/... ./internal/synthesizer/... ./internal/avatars/... ./internal/storage/... ./internal/buildguard/...
      - name: Test relay protocol (no tags)
        run: go test ./internal/relay/

  go-server:
    needs: debounce
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Vet server-tag packages
        run: go vet -tags server ./cmd/relay/... ./internal/relay/...
      - name: Test server-tag packages
        run: go test -tags server ./cmd/relay/... ./internal/relay/...
      - name: Assert dependency closure
        run: '! go list -deps -tags server ./cmd/relay | grep -Eq "internal/(ast|ingestion|host|avatars|storage|synthesizer|window|app|planstate|gather)|/web$|tree-sitter|ledongthuc/pdf|modernc.org/sqlite"'

  web:
    needs: debounce
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Typecheck web
        run: npm --prefix web run typecheck
      - name: Test web
        run: npm --prefix web test
      - name: Test OMP hook
        run: node --test integrations/omp-hook-plan-forge.test.ts
      - name: Build web
        run: npm --prefix web run build
      - name: Upload web-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Install Chromium for Playwright
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Build web
        run: npm --prefix web run build
      - name: Boot the embedded bundle behind the bridge CSP and handshake
        run: npm --prefix web run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/test-results

  go-client:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Download web-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Vet client-tag packages
        env:
          CGO_ENABLED: "1"
        run: go vet -tags client ./...
      - name: Test client-tag packages
        env:
          CGO_ENABLED: "1"
        run: go test -tags client ./...

  # The release matrix ships a Windows client, but until this job existed no
  # CI run ever compiled one: the _windows.go process, path and file helpers
  # were first exercised at tag time, where a break costs a re-cut release.
  # The client needs CGO for tree-sitter, so this is a native runner, not a
  # GOOS=windows cross-build, which cannot link those bindings at all.
  #
  # Vet, build and smoke are the gate. The test run is not, yet: its first run
  # found 19 failures across 7 packages that predate this job, all of them
  # tests asserting POSIX paths and permissions rather than product faults on
  # Windows. Gating on them would block every pull request on work nobody has
  # scheduled. The step still runs and still prints them, so the number can
  # only go down; it becomes the gate when it reaches zero. Tracked in
  # FOLLOW_UPS.md.
  go-client-windows:
    needs: web
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert C toolchain (CGO required)
        run: gcc --version
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Download web-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Vet client-tag packages
        env:
          CGO_ENABLED: "1"
        run: go vet -tags client ./...
      - name: Build the client
        env:
          CGO_ENABLED: "1"
        run: go build -tags client -o plan-forge.exe ./cmd/client
      - name: Smoke test
        run: ./plan-forge.exe version
      - name: Test client-tag packages (reporting only; see FOLLOW_UPS.md)
        continue-on-error: true
        env:
          CGO_ENABLED: "1"
        run: go test -tags client ./...

  deploy-script:
    needs: debounce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: shellcheck scripts/deploy-relay-cloudrun.sh tests/deploy/cloudrun_test.sh
      - name: Test Cloud Run deploy script
        run: bash tests/deploy/cloudrun_test.sh
