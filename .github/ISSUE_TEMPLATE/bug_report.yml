name: Bug report
description: Report something that is broken or behaves unexpectedly
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Do not report security vulnerabilities here; use the private vulnerability reporting link on the issue chooser instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps needed to reproduce the behavior.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual behavior
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit SHA you are using.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime versions, and anything else relevant to your setup.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output or error messages. Remove any secrets before pasting.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have read and agree to follow the Code of Conduct.
          required: true
